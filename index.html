<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=DM+Sans:ital,wght@0,300;0,500;0,600;0,700;1,600&display=swap">
    <link rel="stylesheet" href="./styles/styles.config.css">
    <link rel="stylesheet" href="./styles/index.css">
    <title>Frontend Mentor | Weather app</title>
</head>

<body>
    <header id="header">
        <img src="./assets/images/logo.svg" alt="Weather Now">
    </header>

    <main>
        <h1>How's the sky looking today?</h1>

        <section id="filters">
            <div id="inputCiudad">
                <img src="./assets/images/icon-search.svg" alt="">
                <input type="text" id="ciudadFilter" placeholder="Search for a place..." aria-label="Search for a place">
            </div>
            <button id="btnBuscar">Search</button>
        </section>

        <p id="mensaje"></p>

        <section id="clima">
            <div id="columnaPrincipal">
                <article id="hoy">
                    <div>
                        <h2 id="lugar"></h2>
                        <p id="fecha"></p>
                    </div>
                    <div id="temperaturaHoy">
                        <img id="iconoHoy" src="./assets/images/icon-loading.svg" alt="">
                        <p id="temperatura"></p>
                    </div>
                </article>

                <section id="detalles">
                    <div class="detalle">
                        <p>Feels Like</p>
                        <p id="sensacion" class="valor">-</p>
                    </div>
                    <div class="detalle">
                        <p>Humidity</p>
                        <p id="humedad" class="valor">-</p>
                    </div>
                    <div class="detalle">
                        <p>Wind</p>
                        <p id="viento" class="valor">-</p>
                    </div>
                    <div class="detalle">
                        <p>Precipitation</p>
                        <p id="precipitacion" class="valor">-</p>
                    </div>
                </section>

                <section>
                    <h3>Daily forecast</h3>
                    <div id="dias"></div>
                </section>
            </div>

            <aside id="horas">
                <div id="cabeceraHoras">
                    <h3>Hourly forecast</h3>
                    <select id="selectDia" aria-label="Day"></select>
                </div>
                <div id="listaHoras"></div>
            </aside>
        </section>
    </main>

    <script type="module" src="./script/getData.js"></script>
</body>

</html>
